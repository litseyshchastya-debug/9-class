    const TIMER_DEFAULT = 25; // 25 seconds
    const MAX_ATTEMPTS = 2;
    const STORAGE_KEY = 'informatics_9grade_light_quiz_attempts_v1';

    function App() {
      // Load stored attempt history
      const [attempts, setAttempts] = useState(() => {
        const saved = localStorage.getItem(STORAGE_KEY);
        return saved ? JSON.parse(saved) : [];
      });

      const [gameState, setGameState] = useState('welcome'); // 'welcome', 'quiz', 'results', 'locked'
      const [currentQIndex, setCurrentQIndex] = useState(0);
      const [userAnswers, setUserAnswers] = useState({});
      const [timeLeft, setTimeLeft] = useState(TIMER_DEFAULT);
      const [selectedOption, setSelectedOption] = useState(null);
      const timerRef = useRef(null);

      // Sound feedback synthesizer
      const playBeep = (freq = 440, duration = 0.1) => {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          gain.gain.value = 0.08;
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + duration);
        } catch(e){}
      };

      // Lockout check on startup
      useEffect(() => {
        if (attempts.length >= MAX_ATTEMPTS) {
          setGameState('locked');
        }
      }, [attempts]);

      useEffect(() => {
        if (gameState === 'quiz') {
          setTimeLeft(TIMER_DEFAULT);
          setSelectedOption(null);

          timerRef.current = setInterval(() => {
            setTimeLeft((prev) => {
              if (prev <= 1) {
                clearInterval(timerRef.current);
                handleTimeOut();
                return 0;
              }
              if (prev <= 5) {
                playBeep(650, 0.05);
              }
              return prev - 1;
            });
          }, 1000);
        }

        return () => clearInterval(timerRef.current);
      }, [currentQIndex, gameState]);

      const handleTimeOut = () => {
        playBeep(220, 0.3);
        saveAnswer(null);
      };

      const saveAnswer = (optIndex) => {
        clearInterval(timerRef.current);
        const q = QUESTIONS[currentQIndex];
        
        const newAnswers = {
          ...userAnswers,
          [q.id]: {
            selected: optIndex,
            isCorrect: optIndex === q.correct,
            timeSpent: TIMER_DEFAULT - timeLeft
          }
        };
        setUserAnswers(newAnswers);

        if (currentQIndex + 1 < QUESTIONS.length) {
          setCurrentQIndex(currentQIndex + 1);
        } else {
          finishQuiz(newAnswers);
        }
      };

      const handleOptionClick = (optIndex) => {
        setSelectedOption(optIndex);
      };

      const handleNextClick = () => {
        saveAnswer(selectedOption);
      };

      const finishQuiz = (finalAnswers) => {
        playBeep(880, 0.3);
        let correctCount = 0;
        QUESTIONS.forEach(q => {
          if (finalAnswers[q.id] && finalAnswers[q.id].isCorrect) {
            correctCount++;
          }
        });

        // 12-point grading scale
        const percentage = Math.round((correctCount / QUESTIONS.length) * 100);
        const grade12 = Math.max(1, Math.round((correctCount / QUESTIONS.length) * 12));

        const newAttempt = {
          date: new Date().toLocaleString('uk-UA'),
          score: correctCount,
          total: QUESTIONS.length,
          percentage,
          grade12,
          answers: finalAnswers
        };

        const updatedAttempts = [...attempts, newAttempt];
        setAttempts(updatedAttempts);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(updatedAttempts));

        setGameState('results');
      };

      const startTest = () => {
        if (attempts.length >= MAX_ATTEMPTS) {
          setGameState('locked');
          return;
        }
        setCurrentQIndex(0);
        setUserAnswers({});
        setGameState('quiz');
      };

      if (gameState === 'locked') {
        return (
          <div className="bg-white border border-slate-200 rounded-2xl p-6 md:p-8 shadow-xl text-center space-y-6">
            <div className="inline-flex p-4 bg-rose-50 text-rose-600 rounded-full mb-2 border border-rose-100">
              <svg className="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m0 0v2m0-2h2m-2 0H10m10-7V6a2 2 0 00-2-2H6a2 2 0 00-2 2v6m16 0a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2v-6a2 2 0 012-2m16 0H4"></path>
              </svg>
            </div>
            <h1 className="text-2xl md:text-3xl font-extrabold text-slate-900">Використано всі спроби</h1>
            <p className="text-slate-600 max-w-lg mx-auto">
              Ви повністю використали дозволений ліміт у <span className="font-bold text-slate-900">2 спроби</span>. Повторне складання тесту заблоковано.
            </p>

            <div className="bg-slate-50 rounded-xl p-4 border border-slate-200 space-y-3">
              <h3 className="font-semibold text-slate-700">Історія Ваших результатів:</h3>
              <div className="space-y-2">
                {attempts.map((att, idx) => (
                  <div key={idx} className="flex justify-between items-center bg-white px-4 py-3 rounded-lg text-sm border border-slate-200 shadow-sm">
                    <div>
                      <span className="font-bold text-indigo-600">Спроба #{idx + 1}</span>
                      <span className="text-slate-400 text-xs block">{att.date}</span>
                    </div>
                    <div className="text-right">
                      <span className="text-lg font-bold text-emerald-600">{att.grade12} / 12 балів</span>
                      <span className="text-slate-500 text-xs block">({att.score} з {att.total} відповідей, {att.percentage}%)</span>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            <div className="text-xs text-slate-400">
              Результати збережені у локальному сховищі браузера.
            </div>
          </div>
        );
      }

      if (gameState === 'welcome') {
        return (
          <div className="bg-white border border-slate-200 rounded-2xl p-6 md:p-8 shadow-xl space-y-6">
            <div className="text-center space-y-2">
              <span className="bg-indigo-50 text-indigo-700 border border-indigo-200 px-3 py-1 rounded-full text-xs font-bold tracking-wide uppercase">
                Інформатика • 9 клас
              </span>
              <h1 className="text-2xl md:text-3xl font-black text-slate-900 tracking-tight">
                Розгорнутий інтерактивний тест
              </h1>
              <p className="text-slate-600 text-sm md:text-base max-w-xl mx-auto">
                Підсумковий контрольний тест з тем: БЖД, Інформаційні системи, ОС, Ліцензії, Інсталяція/Драйвери, Доступність (WCAG) та Голосове введення.
              </p>
            </div>

            {/* Test Rules Banner */}
            <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
              <div className="bg-slate-50 border border-slate-200 p-4 rounded-xl flex items-center space-x-3">
                <div className="p-2.5 bg-amber-100 text-amber-700 rounded-lg">
                  <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
                <div>
                  <div className="text-xs text-slate-500">Час на питання</div>
                  <div className="text-sm font-bold text-slate-800">25 секунд</div>
                </div>
              </div>

              <div className="bg-slate-50 border border-slate-200 p-4 rounded-xl flex items-center space-x-3">
                <div className="p-2.5 bg-indigo-100 text-indigo-700 rounded-lg">
                  <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                </div>
                <div>
                  <div className="text-xs text-slate-500">Кількість питань</div>
                  <div className="text-sm font-bold text-slate-800">25 питань</div>
                </div>
              </div>

              <div className="bg-slate-50 border border-slate-200 p-4 rounded-xl flex items-center space-x-3">
                <div className="p-2.5 bg-rose-100 text-rose-700 rounded-lg">
                  <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m0 0v2m0-2h2m-2 0H10m10-7V6a2 2 0 00-2-2H6a2 2 0 00-2 2v6m16 0a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2v-6a2 2 0 012-2m16 0H4"></path></svg>
                </div>
                <div>
                  <div className="text-xs text-slate-500">Ліміт спроб</div>
                  <div className="text-sm font-bold text-rose-600">{attempts.length} з 2 використано</div>
                </div>
              </div>
            </div>

            {/* Attempt history banner if 1 attempt done */}
            {attempts.length > 0 && (
              <div className="bg-indigo-50/70 border border-indigo-200 rounded-xl p-4">
                <div className="text-xs font-bold uppercase text-indigo-700 tracking-wider mb-1">Ваша перша спроба:</div>
                <div className="flex justify-between items-center text-sm">
                  <span className="text-slate-600">{attempts[0].date}</span>
                  <span className="font-black text-emerald-700">{attempts[0].grade12} балів ({attempts[0].percentage}%)</span>
                </div>
              </div>
            )}

            <div className="pt-2">
              <button
                onClick={startTest}
                className="w-full bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-bold py-3.5 px-6 rounded-xl transition duration-200 shadow-md shadow-indigo-200 flex justify-center items-center space-x-2"
              >
                <span>Розпочати спробу #{attempts.length + 1} з 2</span>
                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
              </button>
            </div>
          </div>
        );
      }

      if (gameState === 'quiz') {
        const q = QUESTIONS[currentQIndex];
        const timerPercent = (timeLeft / TIMER_DEFAULT) * 100;
        const isTimerLow = timeLeft <= 5;

        return (
          <div className="bg-white border border-slate-200 rounded-2xl p-5 md:p-8 shadow-xl space-y-6 relative overflow-hidden">
            
            {/* Header & Overall Test Progress */}
            <div className="space-y-3">
              <div className="flex justify-between items-center text-xs md:text-sm">
                <span className="font-semibold text-slate-500">
                  Питання <strong className="text-indigo-600">{currentQIndex + 1}</strong> з {QUESTIONS.length}
                </span>
                <span className="bg-slate-100 border border-slate-200 text-slate-700 px-2.5 py-1 rounded-md text-xs font-semibold">
                  {q.topic}
                </span>
              </div>

              {/* Progress bar across test */}
              <div className="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden border border-slate-200">
                <div 
                  className="bg-indigo-600 h-full transition-all duration-300"
                  style={{ width: `${((currentQIndex + 1) / QUESTIONS.length) * 100}%` }}
                ></div>
              </div>
            </div>

            {/* Timer Display & Countdown Bar */}
            <div className="bg-slate-50 p-3 rounded-xl border border-slate-200 flex items-center space-x-4">
              <div className={`text-xl font-black font-mono px-3 py-1.5 rounded-lg border ${
                isTimerLow 
                  ? 'bg-rose-100 border-rose-300 text-rose-700 timer-warning' 
                  : 'bg-amber-100 border-amber-300 text-amber-800'
              }`}>
                {timeLeft < 10 ? `0${timeLeft}` : timeLeft}с
              </div>
              <div className="flex-1">
                <div className="w-full bg-slate-200 h-3 rounded-full overflow-hidden">
                  <div 
                    className={`h-full transition-all duration-1000 linear ${isTimerLow ? 'bg-rose-500' : 'bg-amber-500'}`}
                    style={{ width: `${timerPercent}%` }}
                  ></div>
                </div>
              </div>
            </div>

            {/* Question Heading */}
            <div className="space-y-2">
              <h2 className="text-lg md:text-xl font-bold text-slate-900 leading-snug">
                {q.question}
              </h2>
            </div>

            {/* Options List */}
            <div className="space-y-2.5">
              {q.options.map((opt, idx) => {
                const isSelected = selectedOption === idx;
                return (
                  <button
                    key={idx}
                    onClick={() => handleOptionClick(idx)}
                    className={`w-full text-left p-4 rounded-xl border transition-all duration-150 flex items-start space-x-3 ${
                      isSelected 
                        ? 'bg-indigo-50 border-indigo-600 text-indigo-950 shadow-sm font-medium' 
                        : 'bg-slate-50/60 border-slate-200 text-slate-700 hover:bg-slate-100 hover:border-slate-300'
                    }`}
                  >
                    <span className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold shrink-0 mt-0.5 ${
                      isSelected ? 'bg-indigo-600 text-white' : 'bg-slate-200 text-slate-600'
                    }`}>
                      {String.fromCharCode(65 + idx)}
                    </span>
                    <span className="text-sm md:text-base leading-relaxed">{opt}</span>
                  </button>
                );
              })}
            </div>

            {/* Submit / Next Button */}
            <div className="pt-2 flex justify-end">
              <button
                onClick={handleNextClick}
                disabled={selectedOption === null}
                className={`py-3 px-6 rounded-xl font-bold transition duration-200 flex items-center space-x-2 ${
                  selectedOption !== null 
                    ? 'bg-emerald-600 hover:bg-emerald-700 text-white shadow-md shadow-emerald-200' 
                    : 'bg-slate-200 text-slate-400 cursor-not-allowed'
                }`}
              >
                <span>{currentQIndex + 1 === QUESTIONS.length ? 'Завершити тест' : 'Наступне питання'}</span>
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7"></path></svg>
              </button>
            </div>

          </div>
        );
      }

      if (gameState === 'results') {
        const lastAttempt = attempts[attempts.length - 1];
        const isLockedNow = attempts.length >= MAX_ATTEMPTS;

        return (
          <div className="bg-white border border-slate-200 rounded-2xl p-6 md:p-8 shadow-xl space-y-6">
            
            {/* Header */}
            <div className="text-center space-y-3 border-b border-slate-200 pb-6">
              <span className="bg-emerald-100 text-emerald-800 border border-emerald-200 px-3 py-1 rounded-full text-xs font-bold tracking-wide uppercase">
                Тестування завершено
              </span>
              <h1 className="text-2xl md:text-3xl font-black text-slate-900">
                Результат спроби #{attempts.length}
              </h1>
              <p className="text-slate-500 text-xs">
                Дата та час: {lastAttempt.date}
              </p>

              {/* Score Display Card */}
              <div className="pt-2 flex justify-center items-center">
                <div className="bg-slate-50 border border-slate-200 rounded-2xl p-6 text-center shadow-sm min-w-[260px]">
                  <div className="text-slate-500 text-xs uppercase font-bold tracking-wider">Оцінка за 12-бальною шкалою</div>
                  <div className="text-5xl font-black text-emerald-600 my-2">{lastAttempt.grade12} <span className="text-2xl text-slate-400 font-normal">/ 12</span></div>
                  <div className="text-sm font-medium text-slate-700">
                    Правильних відповідей: <strong className="text-slate-900">{lastAttempt.score}</strong> з {lastAttempt.total} ({lastAttempt.percentage}%)
                  </div>
                </div>
              </div>
            </div>

            {/* Lock Status / Retake Banner */}
            {isLockedNow ? (
              <div className="bg-rose-50 border border-rose-200 p-4 rounded-xl text-rose-800 text-sm flex items-center space-x-3">
                <svg className="w-6 h-6 shrink-0 text-rose-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                <span>Ви використали максимально дозволену кількість спроб (2 з 2). Тест закрито.</span>
              </div>
            ) : (
              <div className="bg-indigo-50 border border-indigo-200 p-4 rounded-xl text-indigo-900 text-sm flex items-between items-center justify-between">
                <span>У вас залишилась ще <strong className="text-indigo-950">1 спроба</strong> для покращення результату.</span>
                <button 
                  onClick={startTest} 
                  className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-lg text-xs transition shrink-0 ml-3 shadow-sm"
                >
                  Пройти знову (Спроба 2)
                </button>
              </div>
            )}

            {/* Detailed Answer Review */}
            <div className="space-y-4 pt-2">
              <h3 className="text-lg font-bold text-slate-900 border-b border-slate-200 pb-2">
                Аналіз відповідей за поточну спробу:
              </h3>

              <div className="space-y-3 max-h-[400px] overflow-y-auto pr-1">
                {QUESTIONS.map((q, idx) => {
                  const ans = lastAttempt.answers[q.id];
                  const userSel = ans ? ans.selected : null;
                  const isCorrect = ans ? ans.isCorrect : false;

                  return (
                    <div 
                      key={q.id} 
                      className={`p-4 rounded-xl border text-sm space-y-2 ${
                        isCorrect 
                          ? 'bg-emerald-50/60 border-emerald-200' 
                          : 'bg-rose-50/60 border-rose-200'
                      }`}
                    >
                      <div className="flex justify-between items-start">
                        <span className="font-bold text-slate-900">
                          {idx + 1}. {q.question}
                        </span>
                        <span className={`px-2.5 py-0.5 rounded text-xs font-bold shrink-0 ml-2 ${
                          isCorrect ? 'bg-emerald-200 text-emerald-900' : 'bg-rose-200 text-rose-900'
                        }`}>
                          {isCorrect ? 'Вірно' : 'Помилка'}
                        </span>
                      </div>

                      <div className="text-xs space-y-1 pt-1">
                        <div className="text-slate-600">
                          Ваша відповідь: <span className={isCorrect ? 'text-emerald-800 font-semibold' : 'text-rose-800 font-semibold'}>
                            {userSel !== null ? q.options[userSel] : 'Час вичерпано (немає відповіді)'}
                          </span>
                        </div>
                        {!isCorrect && (
                          <div className="text-slate-700">
                            Правильна відповідь: <span className="text-emerald-700 font-bold">{q.options[q.correct]}</span>
                          </div>
                        )}
                        <div className="text-slate-500 italic pt-1 border-t border-slate-200 mt-1">
                          💡 {q.explanation}
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

          </div>
        );
      }

      return null;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
